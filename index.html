<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weird Laws Around the World — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3f3149; --card:#4c3d57; --ink:#fff; --muted:#d9cde3;
    --true:#22c55e; --false:#ef4444; --accent:#f9c74f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;
    background-image:radial-gradient(circle at 15% 10%,rgba(255,255,255,.07),transparent 40%),
                     radial-gradient(circle at 90% 90%,rgba(249,199,79,.08),transparent 45%);
  }
  main{width:100%;max-width:480px;min-height:100%;padding:24px 20px 32px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;animation:in .35s ease}
  .screen.active{display:flex}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .globe{font-size:72px;text-align:center;margin:20px 0 6px}
  h1{font-weight:900;font-size:30px;line-height:1.1;text-align:center;letter-spacing:.5px;text-transform:uppercase}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);text-align:center;margin-top:10px;font-weight:500;line-height:1.5}
  .credits{color:var(--muted);text-align:center;font-size:12px;margin-top:6px;opacity:.8}

  label{display:block;font-weight:700;margin:32px 0 8px}
  input{
    width:100%;padding:16px;border-radius:14px;border:2px solid transparent;font:inherit;font-size:18px;
    background:#fff;color:#2b2233;outline:none
  }
  input:focus{border-color:var(--accent)}
  .err{color:#fca5a5;font-size:14px;min-height:20px;margin-top:6px}

  .btn{
    width:100%;padding:18px;border:none;border-radius:16px;font:inherit;font-weight:800;font-size:18px;
    cursor:pointer;transition:transform .1s, opacity .2s;color:#2b2233;background:var(--accent)
  }
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:default}
  .spacer{flex:1}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
  .dots{display:flex;gap:6px}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
  .dots i.done{background:var(--accent)}
  .dots i.now{background:#fff}
  .round{margin-top:22px;font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}
  .law{font-size:26px;font-weight:900;margin-top:6px}
  .statement{
    background:var(--card);border-radius:20px;padding:26px 22px;margin:22px 0;font-size:21px;font-weight:700;
    line-height:1.4;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)
  }
  .choices{display:grid;gap:14px}
  .choice{
    padding:22px;border-radius:18px;border:3px solid transparent;font:inherit;font-weight:900;font-size:22px;
    color:#fff;cursor:pointer;letter-spacing:1px;transition:transform .1s,opacity .25s,border-color .2s
  }
  .choice:active{transform:scale(.97)}
  .choice.t{background:var(--true)} .choice.f{background:var(--false)}
  .choice.picked{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
  .choice.dim{opacity:.25}
  .choice:disabled{cursor:default}
  .locked{
    text-align:center;margin-top:20px;color:var(--muted);font-weight:600;line-height:1.5;display:none
  }
  .locked b{color:#fff}
  .locked.show{display:block;animation:in .3s ease}
  .eyes{font-size:34px;display:block;margin-bottom:4px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  #nextBtn{margin-top:18px;display:none}
  #nextBtn.show{display:block}

  .scoreWrap{text-align:center;margin-top:10px}
  .hello{font-size:20px;font-weight:800}
  .ring{
    width:170px;height:170px;border-radius:50%;margin:22px auto 10px;display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.12) 0)
  }
  .ring div{width:138px;height:138px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
  .ring strong{font-size:48px;font-weight:900}
  .ring small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:-6px}
  .verdict{font-size:18px;font-weight:800;margin-top:8px}
  .recap{margin-top:22px;display:grid;gap:10px}
  .row{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;text-align:left
  }
  .row .ic{font-size:20px}
  .row .tx{flex:1;font-size:13px;line-height:1.35;font-weight:600}
  .row .tx em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:3px}
  .stamp{margin-top:18px;font-size:12px;color:var(--muted)}
  .again{background:transparent;color:var(--muted);border:2px solid rgba(255,255,255,.2);font-size:14px;padding:12px;margin-top:16px}

  .sent{margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
  .sent.ok{color:#86efac} .sent.ko{color:#fca5a5}
  .sent button{margin-left:6px;background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 8px;font:inherit;cursor:pointer}

  /* host scoreboard */
  main.wide{max-width:760px}
  .hostHead{text-align:center;margin:6px 0 18px}
  .hostHead h1{font-size:28px}
  .live{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;color:var(--muted);font-size:14px}
  .live i{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .board{display:grid;gap:10px}
  .pl{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px 18px;font-weight:700;animation:in .3s ease}
  .pl .rk{width:34px;text-align:center;font-size:20px;font-weight:900;color:var(--muted)}
  .pl .nm{flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .sc{font-size:22px;font-weight:900;color:var(--accent)}
  .pl .tm{font-size:12px;color:var(--muted);width:48px;text-align:right}
  .pl.top{background:linear-gradient(90deg,rgba(249,199,79,.25),var(--card))}
  .empty{text-align:center;color:var(--muted);margin-top:40px;line-height:1.6}
  .stats{display:flex;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .stat{background:var(--card);border-radius:14px;padding:10px 16px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
  .stat b{display:block;font-size:22px;color:#fff}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main>

  <!-- WELCOME -->
  <section class="screen active" id="s-welcome">
    <div class="globe">🌍</div>
    <h1>Weird Laws<br><span>Around the World</span></h1>
    <p class="sub">6 crazy laws. True or false?<br>Answer each one when we show it on screen!</p>
    <p class="credits">Marjana · Aya · Lisa — M2 MRQP</p>
    <label for="name">What's your name?</label>
    <input id="name" maxlength="24" placeholder="Type your name…" autocomplete="off">
    <div class="err" id="err"></div>
    <div class="spacer"></div>
    <button class="btn" id="startBtn">Let's play! 🚀</button>
  </section>

  <!-- QUESTION -->
  <section class="screen" id="s-question">
    <div class="top"><span id="who"></span><div class="dots" id="dots"></div></div>
    <div class="round" id="round"></div>
    <div class="law" id="law"></div>
    <div class="statement" id="statement"></div>
    <div class="choices">
      <button class="choice t" data-a="true">TRUE</button>
      <button class="choice f" data-a="false">FALSE</button>
    </div>
    <p class="locked" id="locked"><span class="eyes">👀</span>Answer locked: <b id="lockedAns"></b><br>Look at the screen for the answer!</p>
    <div class="spacer"></div>
    <button class="btn" id="nextBtn">Next law →</button>
  </section>

  <!-- RESULT -->
  <section class="screen" id="s-result">
    <div class="scoreWrap">
      <div class="hello" id="hello"></div>
      <div class="ring" id="ring"><div><span><strong id="score"></strong><small>out of 6</small></span></div></div>
      <div class="verdict" id="verdict"></div>
      <div class="sent" id="sent"></div>
      <div class="recap" id="recap"></div>
      <div class="stamp" id="stamp"></div>
    </div>
  </section>

  <!-- HOST SCOREBOARD (open with #scores) -->
  <section class="screen" id="s-host">
    <div class="hostHead">
      <h1>Weird Laws <span>Scoreboard</span></h1>
      <div class="live"><i></i><span id="hostInfo">Waiting for players…</span></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="board" id="board"></div>
  </section>

</main>
<div class="confetti" id="confetti"></div>

<script>
const LAWS = [
  {round:"Round 1 — Food & Daily Life", law:"🇸🇬 Law 1 — Singapore", text:"In Singapore, selling chewing gum is illegal.", answer:true,
   why:"Banned in 1992 because gum was stuck everywhere, even on train doors."},
  {round:"Round 1 — Food & Daily Life", law:"🇬🇧 Law 2 — United Kingdom", text:"In the UK, it's illegal to eat mince pies on Christmas Day.", answer:false,
   why:"A myth! Old 17th-century rules were cancelled long ago."},
  {round:"Round 2 — Animals", law:"🇨🇭 Law 3 — Switzerland", text:"In Switzerland, it's illegal to keep only one guinea pig.", answer:true,
   why:"Guinea pigs are social animals: they need a friend!"},
  {round:"Round 2 — Animals", law:"🇮🇹 Law 4 — Italy", text:"In Venice, feeding pigeons in St Mark's Square is forbidden.", answer:true,
   why:"Pigeons damage historic buildings. Fines from €25 to €500!"},
  {round:"Round 3 — The Craziest Ones", law:"🇯🇵 Law 5 — Japan", text:"In Japan, adults between 40 and 74 have their waist measured during an annual health check-up program.", answer:true,
   why:"The \"Metabo Law\" (2008), to prevent health problems."},
  {round:"Round 3 — The Craziest Ones", law:"🇬🇧 Law 6 — United Kingdom", text:"In the UK, it's illegal to die inside the Houses of Parliament.", answer:false,
   why:"Completely made up: one of the most famous British legal myths!"}
];

const KEY = "weirdlaws-quiz-v1";
const CHANNEL = "https://ntfy.sh/weirdlaws-mrqp-c63817dfb1";
let state = {name:"", i:0, answers:[], id:"", sent:false};
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.name) state = s; }catch(e){} }

const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}

function renderQuestion(){
  const q = LAWS[state.i];
  $("who").textContent = "👤 " + state.name;
  $("dots").innerHTML = LAWS.map((_,k)=>`<i class="${k<state.i?'done':k===state.i?'now':''}"></i>`).join("");
  $("round").textContent = q.round;
  $("law").textContent = q.law;
  $("statement").textContent = "“" + q.text + "”";
  const picked = state.answers[state.i];
  document.querySelectorAll(".choice").forEach(b=>{
    const val = b.dataset.a === "true";
    b.classList.remove("picked","dim");
    b.disabled = picked !== undefined;
    if(picked !== undefined) b.classList.add(val===picked ? "picked" : "dim");
  });
  $("locked").classList.toggle("show", picked !== undefined);
  $("lockedAns").textContent = picked === undefined ? "" : (picked ? "TRUE" : "FALSE");
  $("nextBtn").classList.toggle("show", picked !== undefined);
  $("nextBtn").textContent = state.i === LAWS.length-1 ? "See my score 🏆" : "Next law →";
  show("s-question");
}

function renderResult(){
  const score = LAWS.reduce((n,q,k)=> n + (state.answers[k]===q.answer ? 1 : 0), 0);
  $("hello").textContent = "Well done, " + state.name + "!";
  $("score").textContent = score;
  $("ring").style.setProperty("--p", score/6*100);
  const v = score===6 ? "🏆 Perfect score! You're a law expert!"
          : score>=4 ? "🎉 Great job! You know the world well!"
          : score>=2 ? "🙂 Not bad! The world is full of surprises!"
          : "😅 Oops! Better check the laws before you travel!";
  $("verdict").textContent = v;
  $("recap").innerHTML = LAWS.map((q,k)=>{
    const ok = state.answers[k]===q.answer;
    return `<div class="row"><span class="ic">${ok?"✅":"❌"}</span>
      <div class="tx">${q.law.split(" ")[0]} ${q.text}<em>Answer: <b>${q.answer?"TRUE":"FALSE"}</b> — ${q.why}</em></div></div>`;
  }).join("");
  const d = new Date();
  $("stamp").textContent = "Show this screen to claim your prize · " + d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  show("s-result");
  if(score>=5) confetti();
  sendScore(score);
}

function scoreOf(){ return LAWS.reduce((n,q,k)=> n + (state.answers[k]===q.answer ? 1 : 0), 0); }

async function sendScore(score){
  const el = $("sent");
  if(state.sent){ el.className="sent ok"; el.textContent="✔ Score sent to the presenters"; return; }
  el.className="sent"; el.textContent="Sending your score…";
  const payload = JSON.stringify({id:state.id||newId(), n:state.name, s:score, a:state.answers.map(x=>x?1:0)});
  try{
    const r = await fetch(CHANNEL, {method:"POST", body:payload});
    if(!r.ok) throw new Error(r.status);
    state.sent = true; save();
    el.className="sent ok"; el.textContent="✔ Score sent to the presenters";
  }catch(e){
    el.className="sent ko";
    el.innerHTML = "Couldn't send your score <button id='retry'>Retry</button>";
    $("retry").onclick = ()=> sendScore(scoreOf());
  }
}

/* ---------- host scoreboard ---------- */
function esc(t){ return String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function refreshBoard(){
  let players = {};
  try{
    const r = await fetch(CHANNEL + "/json?poll=1&since=all");
    const txt = await r.text();
    txt.split("\n").forEach(line=>{
      if(!line.trim()) return;
      try{
        const ev = JSON.parse(line);
        if(ev.event!=="message") return;
        const d = JSON.parse(ev.message);
        if(!d || typeof d.n!=="string" || typeof d.s!=="number") return;
        players[d.id || ev.id] = {n:d.n.slice(0,24), s:Math.max(0,Math.min(6,d.s|0)), a:d.a||[], t:ev.time};
      }catch(e){}
    });
  }catch(e){
    $("hostInfo").textContent = "Connection problem, retrying…";
    return;
  }
  const list = Object.values(players).sort((x,y)=> y.s-x.s || x.t-y.t);
  $("hostInfo").textContent = list.length ? "Live · " + list.length + " player" + (list.length>1?"s":"") : "Waiting for players…";
  if(!list.length){
    $("stats").innerHTML = "";
    $("board").innerHTML = "<p class='empty'>No scores yet.<br>Scores appear here as soon as players finish the quiz.</p>";
    return;
  }
  const avg = (list.reduce((n,p)=>n+p.s,0)/list.length).toFixed(1);
  const perfect = list.filter(p=>p.s===6).length;
  // hardest law = most wrong answers
  let worst = -1, worstK = 0;
  LAWS.forEach((q,k)=>{ const wrong = list.filter(p=> p.a[k]!==undefined && (p.a[k]===1)!==q.answer).length; if(wrong>worst){worst=wrong;worstK=k;} });
  $("stats").innerHTML =
    `<div class="stat"><b>${list.length}</b>players</div>
     <div class="stat"><b>${avg}/6</b>average</div>
     <div class="stat"><b>${perfect}</b>perfect scores</div>
     <div class="stat"><b>${LAWS[worstK].law.split(" ")[0]} Law ${worstK+1}</b>trickiest law</div>`;
  const medals = ["🥇","🥈","🥉"];
  $("board").innerHTML = list.map((p,k)=>{
    const tm = new Date(p.t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    return `<div class="pl ${k<3?'top':''}"><span class="rk">${medals[k]||k+1}</span><span class="nm">${esc(p.n)}</span><span class="sc">${p.s}/6</span><span class="tm">${tm}</span></div>`;
  }).join("");
}

function startHost(){
  document.querySelector("main").classList.add("wide");
  show("s-host");
  refreshBoard();
  setInterval(refreshBoard, 5000);
}

function confetti(){
  const c = $("confetti"), colors=["#f9c74f","#22c55e","#ef4444","#fff","#90cdf4"];
  for(let k=0;k<90;k++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[k%colors.length];
    p.style.animationDuration=(2+Math.random()*2.5)+"s";
    p.style.animationDelay=Math.random()*0.8+"s";
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML="",6000);
}

$("startBtn").onclick = ()=>{
  const n = $("name").value.trim();
  if(!n){ $("err").textContent = "Please type your name first 🙂"; return; }
  state = {name:n, i:0, answers:[], id:newId(), sent:false};
  save(); renderQuestion();
};
$("name").addEventListener("keydown", e=>{ if(e.key==="Enter") $("startBtn").click(); });
$("name").addEventListener("input", ()=> $("err").textContent="");

document.querySelectorAll(".choice").forEach(b=>{
  b.onclick = ()=>{
    if(state.answers[state.i] !== undefined) return;
    state.answers[state.i] = b.dataset.a === "true";
    save(); renderQuestion();
  };
});

$("nextBtn").onclick = ()=>{
  if(state.i < LAWS.length-1){ state.i++; save(); renderQuestion(); }
  else { state.i = LAWS.length; save(); renderResult(); }
};


// host mode: open the page with #scores
if(location.hash === "#scores"){ startHost(); }
else {
// resume after an accidental refresh
load();
if(state.name){
  if(state.i >= LAWS.length) renderResult(); else renderQuestion();
}
}
</script>
</body>
</html>
